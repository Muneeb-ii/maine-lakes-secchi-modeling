<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Lake water clarity">
  <defs>
    <clipPath id="disk">
      <circle cx="100" cy="100" r="71" />
    </clipPath>
    <clipPath id="left-half">
      <rect x="0" y="0" width="100" height="200" />
    </clipPath>
  </defs>

  <!-- Double blue border -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#005AB5" stroke-width="12" />
  <circle cx="100" cy="100" r="84" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="100" cy="100" r="78" fill="none" stroke="#005AB5" stroke-width="10" />

  <g clip-path="url(#disk)">
    <!-- Left half: sky -->
    <g clip-path="url(#left-half)">
      <rect x="0" y="0" width="100" height="200" fill="#FFFFFF" />
      <path
        d="M 29 100.5
           C 38 92, 44 108, 52 99.5
           C 60 91, 68 107, 76 99
           C 84 91, 92 105, 100 100
           L 100 171
           A 71 71 0 0 0 29 100.5
           Z"
        fill="#7EB8E8"
      />
    </g>

    <!-- Right half: Secchi disk quadrants -->
    <path d="M 100 29 A 71 71 0 0 1 171 100 L 100 100 Z" fill="#005AB5" />
    <path d="M 171 100 A 71 71 0 0 1 100 171 L 100 100 Z" fill="#FFFFFF" />

    <!-- Center divider -->
    <line x1="100" y1="29" x2="100" y2="171" stroke="#005AB5" stroke-width="2.25" />
    <!-- Secchi horizontal -->
    <line x1="100" y1="100" x2="171" y2="100" stroke="#005AB5" stroke-width="2.25" />
    <!-- Wave outline -->
    <path
      d="M 29 100.5
         C 38 92, 44 108, 52 99.5
         C 60 91, 68 107, 76 99
         C 84 91, 92 105, 100 100"
      fill="none"
      stroke="#005AB5"
      stroke-width="2.25"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
