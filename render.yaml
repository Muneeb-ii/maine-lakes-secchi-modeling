services:
  - type: web
    name: maine-lakes-secchi-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./dashboard/render.Dockerfile
    dockerContext: .
    # Nginx serves the SPA immediately while the model-backed API warms up.
    # Probing /api/ during startup can fail because model loading takes ~45s.
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: MODEL_ARTIFACTS_PATH
        value: /app/artifacts/models
      - key: PORT
        value: 10000
